name: Build
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create / cache devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/.devcontainer.json
          imageName: ghcr.io/${{ github.repository_owner }}/1551-repico_devcontainer
          cacheFrom: ghcr.io/${{ github.repository_owner }}/1551-repico_devcontainer
          push: always

      - name: Build 1551-III-Pico
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/.devcontainer.json
          imageName: ghcr.io/${{ github.repository_owner }}/1551-repico_devcontainer
          # Workspace is already the repo root inside the container (repo name may vary).
          runCmd: |
            set -eux
            pwd
            test -d firmware-1551-III-pico
            cmake -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_EXPORT_COMPILE_COMMANDS=TRUE \
                  -S firmware-1551-III-pico \
                  -B build \
                  -G Ninja
            cmake --build build --config Release
            ls -la build/1551-III-Pico.uf2 build/1551-III-Pico.elf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1551-III-Pico-binaries
          path: |
            build/1551-III-Pico.uf2
            build/1551-III-Pico.elf
